  capture-animation-success-subtitle: "<gray>You captured <green>{entity}</green>!"
  capture-animation-failure-title: "<red><bold>Capture Failed!</bold>"
  capture-animation-failure-subtitle: "<gray>The creature broke free. <white>({chance}% chance)"
  not-enough-cost: "{prefix}You do not have enough {cost}."
  wallet-charged: "{prefix}[Wallet Charged: ${amount}]"
  item-charged: "{prefix}[{item} Charged: {amount}]"
  creature-released: "{prefix}{entity} successfully spawned!"
  release-disabled-world: "{prefix}You cannot release a creature in this world!"
